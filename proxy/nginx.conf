# Reverse proxy du docker-compose : expose le front et l'API sur une seule origine.
# Reproduit le rôle de l'Ingress Kubernetes (`/` -> front, `/api` -> API),
# ce qui permet au navigateur d'appeler l'API en relatif, sans CORS.

upstream frontend {
    server frontend:80;
}

upstream backend {
    server backend:3001;
}

server {
    listen 80;
    server_name _;

    # Upload de photos : la limite par défaut de nginx (1 Mo) est trop basse.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # L'URI est transmise telle quelle (pas de chemin après le nom d'hôte
    # dans proxy_pass) : l'API reçoit bien /api/photos, préfixe compris.
    location /api {
        proxy_pass http://backend;
        # Le proxy de fichiers peut renvoyer des images volumineuses.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
