# Modèle du Secret. Le vrai fichier n'est JAMAIS versionné :
#
#   cp k8s/secrets.example.yaml k8s/secret.yaml
#   # puis remplacer les valeurs « a_remplacer »
#
# `k8s/**/secret.yaml` est dans le .gitignore, et `kustomization.yaml` référence
# secret.yaml : sans cette copie, `kubectl apply -k k8s/` échoue d'emblée — ce
# qui est préférable à un déploiement avec des identifiants d'exemple.
#
# `stringData` plutôt que `data` : les valeurs sont en clair dans le fichier,
# c'est Kubernetes qui les encode en base64. Un Secret n'est de toute façon pas
# chiffré, seulement encodé — il est hors de git parce qu'il est en clair.
apiVersion: v1
kind: Secret
metadata:
  name: galerie-secrets
type: Opaque
stringData:
  # --- MongoDB ---
  # Attention : ces identifiants ne sont pris en compte qu'au tout premier
  # démarrage, quand le volume est vide. Les changer ensuite demande de
  # supprimer le PVC (kubectl delete pvc data-mongodb-0).
  MONGO_USER: photo
  MONGO_PASSWORD: a_remplacer
  # --- MinIO ---
  # MINIO_SECRET_KEY doit faire au moins 8 caractères.
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: a_remplacer
  # --- Administration ---
  # Un seul compte. L'empreinte se génère avec :
  #   cd backend && npm run hash -- "mon mot de passe"
  # On ne stocke jamais le mot de passe lui-même : une variable d'environnement
  # se retrouve vite dans un `kubectl describe`, un vidage de crash ou un journal.
  ADMIN_USER: nroi
  ADMIN_PASSWORD_HASH: scrypt:16384:8:1:a_remplacer:a_remplacer
  # Signature des cookies de session, à tirer au hasard :
  #   node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))'
  # Le changer invalide toutes les sessions ouvertes.
  SESSION_SECRET: a_remplacer
