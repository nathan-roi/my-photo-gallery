# Service ClusterIP devant les pods nginx. C'est lui que l'Ingress désigne
# pour `/`, c'est-à-dire tout ce qui n'est pas /api.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
