# Service ClusterIP ordinaire, contrairement à celui de MongoDB : une seule
# instance de MinIO, et l'API n'a pas besoin de joindre un pod nommément, juste
# « le » MinIO. Il faudrait le passer en headless pour un MinIO distribué, qui
# exige que chaque nœud connaisse l'adresse de ses pairs.
#
# Le port 9001 (console web) n'est pas exposé par l'Ingress : il ne sert qu'au
# diagnostic, via `kubectl port-forward svc/minio 9001:9001`.
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
