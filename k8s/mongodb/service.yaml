# Service headless (clusterIP: None) : il ne fait pas d'équilibrage de charge,
# il publie directement les adresses des pods dans le DNS. C'est ce qu'exige un
# StatefulSet pour donner à chaque pod un nom stable — ici `mongodb-0.mongodb`.
#
# Le nom court `mongodb` reste résolvable depuis l'API, comme le nom de service
# en docker compose : c'est ce que MONGO_URL utilise.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
