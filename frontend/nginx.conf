server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les assets buildés ont un hash dans leur nom : ils sont immuables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : toute URL inconnue renvoie index.html, sinon un
    # rechargement sur /photos/42 donnerait un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
